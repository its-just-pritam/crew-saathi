<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Crew Admin</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #161d2e;
    --tile: #1c2438;
    --border: #2a3350;
    --text: #e6e9f0;
    --muted: #8892a6;
    --accent: #5b8cff;
    --warning: #f2b84b;
    --danger: #f2554b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
  }
  .sidebar {
    width: 220px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 24px 0;
    flex-shrink: 0;
    height: 100vh;
    overflow-y: auto;
    position: fixed;
    left: 0;
    top: 0;
  }
  .sidebar-logo {
    padding: 0 20px 24px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-logo a {
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.3px;
  }
  .sidebar-logo a span {
    color: var(--accent);
  }
  .sidebar-nav {
    display: flex;
    flex-direction: column;
  }
  .sidebar-nav a {
    color: var(--muted);
    text-decoration: none;
    padding: 10px 20px;
    font-size: 13px;
    transition: color 0.12s ease, background 0.12s ease;
    border-left: 3px solid transparent;
  }
  .sidebar-nav a:hover {
    color: var(--text);
    background: rgba(91, 140, 255, 0.1);
  }
  .sidebar-nav a.active {
    color: var(--accent);
    background: rgba(91, 140, 255, 0.15);
    border-left-color: var(--accent);
  }
  .timezone-selector {
    padding: 16px 20px;
    margin-top: auto;
    border-top: 1px solid var(--border);
  }
  .timezone-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    display: block;
    margin-bottom: 8px;
  }
  .timezone-buttons {
    display: flex;
    gap: 6px;
  }
  .tz-btn {
    flex: 1;
    padding: 6px 8px;
    font-size: 11px;
    font-weight: 600;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .tz-btn:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  .tz-btn.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }
  .main-content {
    margin-left: 220px;
    flex: 1;
    padding: 24px 32px 48px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 {
    font-size: 22px;
    margin: 0;
    letter-spacing: 0.3px;
  }
  h1 span { color: var(--accent); }

  /* Disclaimer Banner (Time Convention) */
  .disclaimer-banner {
    background: linear-gradient(135deg, rgba(242, 181, 75, 0.15), rgba(242, 85, 75, 0.1));
    border: 1px solid rgba(242, 181, 75, 0.3);
    border-left: 4px solid var(--warning);
    border-radius: 8px;
    padding: 16px 18px;
    margin-bottom: 32px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
  }
  .disclaimer-banner-title {
    font-weight: 600;
    color: var(--warning);
    margin-bottom: 6px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  /* Notes Section (Definitions) */
  .section-title {
    font-size: 14px;
    margin: 0 0 16px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 600;
  }
  .notes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px;
    margin-bottom: 32px;
  }
  .note-card {
    background: linear-gradient(135deg, rgba(91, 140, 255, 0.08), rgba(53, 201, 127, 0.05));
    border: 1px solid rgba(91, 140, 255, 0.2);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    padding: 14px;
    font-size: 12px;
  }
  .note-card-title {
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 6px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .note-card-text {
    color: var(--muted);
    line-height: 1.5;
  }

  /* Notice Board (Regulations) */
  .notice-board {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
  }
  .notice-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    position: relative;
    overflow: hidden;
  }
  .notice-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), rgba(91, 140, 255, 0.3));
  }
  .notice-card-id {
    font-size: 10px;
    font-weight: 700;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 6px;
  }
  .notice-card-text {
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
    margin-bottom: 12px;
    font-weight: 500;
  }
  .notice-card-params {
    border-top: 1px solid var(--border);
    padding-top: 10px;
    margin-top: 10px;
  }
  .notice-card-params-title {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.3px;
    margin-bottom: 6px;
    font-weight: 600;
  }
  .param-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    padding: 3px 0;
    color: var(--muted);
  }
  .param-key {
    color: var(--muted);
  }
  .param-value {
    color: var(--accent);
    font-weight: 600;
  }

  .summary-bar {
    display: flex;
    gap: 14px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .summary-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 18px;
    min-width: 120px;
  }
  .summary-card .num { font-size: 22px; font-weight: 600; }
  .summary-card .lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .empty-msg {
    color: var(--muted);
    font-size: 13px;
    padding: 20px;
    text-align: center;
  }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <a href="crew_mockup.html">Crew<span>Saathi</span></a>
  </div>
  <nav class="sidebar-nav">
    <a href="crew_mockup.html">Crew Roster</a>
    <a href="certifications_mockup.html">Certifications</a>
    <a href="duty_clocks_mockup.html">Duty Clocks</a>
    <a href="flights_mockup.html">Flights</a>
    <a href="rosters_mockup.html">Rosters</a>
    <a href="rules_mockup.html" class="active">Rules</a>
  </nav>
  <div class="timezone-selector">
    <span class="timezone-label">Time Zone</span>
    <div class="timezone-buttons">
      <button class="tz-btn active" data-tz="UTC" onclick="setTimeZone('UTC')">UTC</button>
      <button class="tz-btn" data-tz="LOCAL" onclick="setTimeZone('LOCAL')">Local</button>
    </div>
  </div>
</aside>

<div class="main-content">
<header>
  <h1>Crew<span>Admin</span> — Rules</h1>
</header>

<div class="summary-bar" id="summaryBar"></div>

<!-- Disclaimer Banner -->
<div class="disclaimer-banner" id="disclaimer"></div>

<!-- Definitions (Notes) -->
<div style="margin-bottom: 32px;">
  <h2 class="section-title">Definitions</h2>
  <div class="notes-grid" id="definitionsList"></div>
</div>

<!-- Regulations (Notice Board) -->
<div>
  <h2 class="section-title">Regulations</h2>
  <div class="notice-board" id="rulesList"></div>
</div>

<script>
const RULES_URL = "data/rules.json";
let globalTimeZone = localStorage.getItem('timeZone') || 'UTC';
let rulesData = null;

function setTimeZone(tz) {
  globalTimeZone = tz;
  localStorage.setItem('timeZone', tz);

  document.querySelectorAll('.tz-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tz === tz);
  });
}

function renderSummary(data) {
  const summaryBar = document.getElementById("summaryBar");
  if (!data) return;

  const ruleCount = data.rules ? data.rules.length : 0;
  const defCount = data.definitions ? Object.keys(data.definitions).length : 0;

  summaryBar.innerHTML = `
    <div class="summary-card"><div class="num">${ruleCount}</div><div class="lbl">Regulations</div></div>
    <div class="summary-card"><div class="num">${defCount}</div><div class="lbl">Definitions</div></div>
  `;
}

function renderDisclaimer(data) {
  const elem = document.getElementById("disclaimer");
  if (!data || !data.time_convention) {
    elem.innerHTML = `<div class="empty-msg">No convention defined</div>`;
    return;
  }
  elem.innerHTML = `
    <div class="disclaimer-banner-title">⚠ Time Convention</div>
    ${data.time_convention}
  `;
}

function renderDefinitions(data) {
  const elem = document.getElementById("definitionsList");
  if (!data || !data.definitions || Object.keys(data.definitions).length === 0) {
    elem.innerHTML = `<div class="empty-msg">No definitions available</div>`;
    return;
  }

  const html = Object.entries(data.definitions).map(([key, value]) => `
    <div class="note-card">
      <div class="note-card-title">${key}</div>
      <div class="note-card-text">${value}</div>
    </div>
  `).join("");

  elem.innerHTML = html;
}

function renderRules(data) {
  const elem = document.getElementById("rulesList");
  if (!data || !data.rules || data.rules.length === 0) {
    elem.innerHTML = `<div class="empty-msg">No rules available</div>`;
    return;
  }

  const html = data.rules.map(rule => {
    const params = rule.params || {};
    const paramsHtml = Object.entries(params).length > 0 ? `
      <div class="notice-card-params">
        <div class="notice-card-params-title">Parameters</div>
        ${Object.entries(params).map(([key, value]) => `
          <div class="param-row">
            <span class="param-key">${key}</span>
            <span class="param-value">${value}</span>
          </div>
        `).join("")}
      </div>
    ` : "";

    return `
      <div class="notice-card">
        <div class="notice-card-id">${rule.rule_id}</div>
        <div class="notice-card-text">${rule.text}</div>
        ${paramsHtml}
      </div>
    `;
  }).join("");

  elem.innerHTML = html;
}

function render(data) {
  renderSummary(data);
  renderDisclaimer(data);
  renderDefinitions(data);
  renderRules(data);
}

fetch(RULES_URL)
  .then(res => res.json())
  .then(data => {
    rulesData = data;
    document.querySelectorAll('.tz-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tz === globalTimeZone);
    });
    render(data);
  })
  .catch(() => {
    document.getElementById("rulesList").innerHTML =
      `<div class="empty-msg">Could not load ${RULES_URL}. Serve this file over HTTP (not file://) so the fetch works.</div>`;
  });
</script>

</div>
</body>
</html>
