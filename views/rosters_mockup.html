<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Crew Admin</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #161d2e;
    --tile: #1c2438;
    --border: #2a3350;
    --text: #e6e9f0;
    --muted: #8892a6;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
  }
  .sidebar {
    width: 220px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 24px 0;
    flex-shrink: 0;
    height: 100vh;
    overflow-y: auto;
    position: fixed;
    left: 0;
    top: 0;
  }
  .sidebar-logo {
    padding: 0 20px 24px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-logo a {
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.3px;
  }
  .sidebar-logo a span {
    color: var(--accent);
  }
  .sidebar-nav {
    display: flex;
    flex-direction: column;
  }
  .sidebar-nav a {
    color: var(--muted);
    text-decoration: none;
    padding: 10px 20px;
    font-size: 13px;
    transition: color 0.12s ease, background 0.12s ease;
    border-left: 3px solid transparent;
  }
  .sidebar-nav a:hover {
    color: var(--text);
    background: rgba(91, 140, 255, 0.1);
  }
  .sidebar-nav a.active {
    color: var(--accent);
    background: rgba(91, 140, 255, 0.15);
    border-left-color: var(--accent);
  }
  .timezone-selector {
    padding: 16px 20px;
    margin-top: auto;
    border-top: 1px solid var(--border);
  }
  .timezone-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    display: block;
    margin-bottom: 8px;
  }
  .timezone-buttons {
    display: flex;
    gap: 6px;
  }
  .tz-btn {
    flex: 1;
    padding: 6px 8px;
    font-size: 11px;
    font-weight: 600;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .tz-btn:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  .tz-btn.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }
  .main-content {
    margin-left: 220px;
    flex: 1;
    padding: 24px 32px 48px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 {
    font-size: 22px;
    margin: 0;
    letter-spacing: 0.3px;
  }
  h1 span { color: var(--accent); }
  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .toolbar input, .toolbar select {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
  }
  .summary-bar {
    display: flex;
    gap: 14px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .summary-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 18px;
    min-width: 120px;
  }
  .summary-card .num { font-size: 22px; font-weight: 600; }
  .summary-card .lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .group { margin-bottom: 24px; }
  .group-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    cursor: pointer;
    user-select: none;
  }
  .group-header h2 {
    font-size: 15px;
    margin: 0;
    letter-spacing: 0.4px;
  }
  .group-header .count {
    font-size: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 2px 10px;
    border-radius: 999px;
  }
  .group-header .caret {
    color: var(--muted);
    transition: transform 0.15s ease;
    font-size: 11px;
  }
  .group.collapsed .caret { transform: rotate(-90deg); }
  .group.collapsed .pairings-list { display: none; }

  .pairings-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .pairing-card {
    background: var(--tile);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    transition: border-color 0.12s ease;
    cursor: pointer;
  }
  .pairing-card:hover {
    border-color: var(--accent);
  }
  .pairing-card.expanded {
    border-color: var(--accent);
  }
  .pairing-header {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto;
    gap: 16px;
    align-items: center;
    margin-bottom: 0;
  }
  .pairing-header.expanded {
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .pairing-id {
    font-weight: 600;
    font-size: 14px;
  }
  .pairing-meta {
    font-size: 12px;
    color: var(--muted);
  }
  .pairing-caret {
    color: var(--muted);
    transition: transform 0.12s ease;
    font-size: 14px;
  }
  .pairing-card.expanded .pairing-caret {
    transform: rotate(90deg);
  }

  .pairing-details {
    display: none;
    margin-top: 12px;
  }
  .pairing-card.expanded .pairing-details {
    display: block;
  }

  .crew-section {
    margin-bottom: 16px;
  }
  .crew-section h3 {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin: 0 0 8px;
  }
  .crew-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 8px;
  }
  .crew-item {
    background: rgba(91, 140, 255, 0.1);
    border-left: 3px solid var(--accent);
    padding: 8px 10px;
    border-radius: 4px;
    font-size: 11px;
  }
  .crew-role {
    color: var(--muted);
    font-size: 10px;
    margin-top: 2px;
  }
  .crew-id {
    font-weight: 600;
    color: var(--text);
  }

  .flights-section {
    margin-top: 12px;
  }
  .flights-section h3 {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin: 0 0 8px;
  }
  .flights-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .flight-badge {
    background: rgba(91, 140, 255, 0.15);
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
    text-decoration: none;
    display: inline-block;
    cursor: pointer;
    transition: background 0.12s ease;
  }
  .flight-badge:hover {
    background: rgba(91, 140, 255, 0.25);
  }
  .crew-item a {
    color: inherit;
    text-decoration: none;
  }
  .crew-id {
    font-weight: 600;
    color: var(--accent);
    cursor: pointer;
    transition: opacity 0.12s ease;
  }
  .crew-item a:hover .crew-id {
    opacity: 0.7;
  }

  .empty-msg {
    color: var(--muted);
    font-size: 13px;
    padding: 20px;
    text-align: center;
  }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <a href="crew_mockup.html">Crew<span>Saathi</span></a>
  </div>
  <nav class="sidebar-nav">
    <a href="crew_mockup.html">Crew Roster</a>
    <a href="certifications_mockup.html">Certifications</a>
    <a href="duty_clocks_mockup.html">Duty Clocks</a>
    <a href="flights_mockup.html">Flights</a>
    <a href="rosters_mockup.html" class="active">Rosters</a>
    <a href="rules_mockup.html">Rules</a>
  </nav>
  <div class="timezone-selector">
    <span class="timezone-label">Time Zone</span>
    <div class="timezone-buttons">
      <button class="tz-btn active" data-tz="UTC" onclick="setTimeZone('UTC')">UTC</button>
      <button class="tz-btn" data-tz="LOCAL" onclick="setTimeZone('LOCAL')">Local</button>
    </div>
  </div>
</aside>

<div class="main-content">
<header>
  <h1>Crew<span>Admin</span> — Rosters</h1>
  <div class="toolbar">
    <input id="searchBox" type="text" placeholder="Search pairing id or flight…" />
    <select id="aircraftFilter">
      <option value="all">All aircraft</option>
    </select>
    <select id="dateFilter">
      <option value="all">All dates</option>
    </select>
  </div>
</header>

<div class="summary-bar" id="summaryBar"></div>

<div id="groupsContainer"></div>

<script>
const ROSTERS_URL = "data/rosters.json";
const CREW_URL = "data/crew.json";
let globalTimeZone = localStorage.getItem('timeZone') || 'UTC';
let crewById = {};

function setTimeZone(tz) {
  globalTimeZone = tz;
  localStorage.setItem('timeZone', tz);

  document.querySelectorAll('.tz-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tz === tz);
  });
}

function formatTime(isoString) {
  const d = new Date(isoString);
  if (globalTimeZone === 'UTC') {
    const utcStr = d.toLocaleString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'UTC' });
    return utcStr;
  } else {
    return d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: false });
  }
}

function formatDate(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: '2-digit' });
}

function populateAircraftFilter(rosters) {
  const aircraftFilter = document.getElementById("aircraftFilter");
  const aircraft = [...new Set(rosters.pairings.map(p => p.aircraft))].sort();
  aircraft.forEach(a => {
    const opt = document.createElement("option");
    opt.value = a;
    opt.textContent = a;
    aircraftFilter.appendChild(opt);
  });
}

function populateDateFilter(rosters) {
  const dateFilter = document.getElementById("dateFilter");
  const dates = new Set();
  rosters.pairings.forEach(p => {
    p.days.forEach(d => dates.add(d.date));
  });
  const sorted = [...dates].sort();
  sorted.forEach(d => {
    const opt = document.createElement("option");
    opt.value = d;
    opt.textContent = formatDate(d);
    dateFilter.appendChild(opt);
  });
}

function render(rosters) {
  const groupsContainer = document.getElementById("groupsContainer");
  const summaryBar = document.getElementById("summaryBar");
  groupsContainer.innerHTML = "";

  const searchTerm = document.getElementById("searchBox").value.trim().toLowerCase();
  const aircraftFilter = document.getElementById("aircraftFilter").value;
  const dateFilter = document.getElementById("dateFilter").value;

  const filtered = rosters.pairings.filter(p => {
    if (aircraftFilter !== "all" && p.aircraft !== aircraftFilter) return false;
    if (dateFilter !== "all" && !p.days.some(d => d.date === dateFilter)) return false;
    if (searchTerm) {
      const flightMatch = p.days.some(d => d.flights.some(f => f.toLowerCase().includes(searchTerm)));
      const pairingMatch = p.pairing_id.toLowerCase().includes(searchTerm);
      if (!flightMatch && !pairingMatch) return false;
    }
    return true;
  });

  summaryBar.innerHTML = `
    <div class="summary-card"><div class="num">${filtered.length}</div><div class="lbl">Pairings</div></div>
    <div class="summary-card"><div class="num">${new Set(filtered.map(p => p.aircraft)).size}</div><div class="lbl">Aircraft</div></div>
    <div class="summary-card"><div class="num">${filtered.reduce((sum, p) => sum + p.crew.length, 0)}</div><div class="lbl">Crew assignments</div></div>
  `;

  const groups = {};
  filtered.forEach(p => {
    if (!groups[p.aircraft]) groups[p.aircraft] = [];
    groups[p.aircraft].push(p);
  });

  const groupNames = Object.keys(groups).sort();

  if (groupNames.length === 0) {
    groupsContainer.innerHTML = `<div class="empty-msg">No pairings match the current filters.</div>`;
    return;
  }

  groupNames.forEach(aircraft => {
    const items = groups[aircraft];
    const groupEl = document.createElement("div");
    groupEl.className = "group";

    const header = document.createElement("div");
    header.className = "group-header";
    header.innerHTML = `
      <span class="caret">▼</span>
      <h2>${aircraft}</h2>
      <span class="count">${items.length}</span>
    `;
    header.addEventListener("click", () => groupEl.classList.toggle("collapsed"));

    const pairingsEl = document.createElement("div");
    pairingsEl.className = "pairings-list";
    pairingsEl.innerHTML = items.map(p => `
      <div class="pairing-card" onclick="this.classList.toggle('expanded')">
        <div class="pairing-header expanded">
          <div>
            <div class="pairing-id">${p.pairing_id}</div>
            <div class="pairing-meta">${p.days.map(d => formatDate(d.date)).join(", ")}</div>
          </div>
          <div>
            <div class="pairing-meta">Report: ${formatTime(p.days[0].report_utc)}</div>
            <div class="pairing-meta">Release: ${formatTime(p.days[p.days.length - 1].release_utc)}</div>
          </div>
          <div>
            <div class="pairing-meta">${p.crew.length} crew</div>
            <div class="pairing-meta">${p.days.reduce((sum, d) => sum + d.flights.length, 0)} flights</div>
          </div>
          <div class="pairing-caret">▶</div>
        </div>
        <div class="pairing-details">
          <div class="crew-section">
            <h3>Crew Assignment</h3>
            <div class="crew-grid">
              ${p.crew.map(c => `
                <div class="crew-item">
                  <a href="crew_mockup.html#crew_id=${encodeURIComponent(c.crew_id)}">
                    <div class="crew-id">${c.crew_id}</div>
                    <div class="crew-role">${c.role}</div>
                  </a>
                </div>
              `).join("")}
            </div>
          </div>
          <div class="flights-section">
            <h3>Flights</h3>
            <div class="flights-list">
              ${p.days.flatMap(d => d.flights).map(f => {
                const parts = f.split('-');
                const flightNum = parts[0];
                const date = parts.slice(1).join('-');
                return `<a href="flights_mockup.html#flight=${flightNum}&date=${date}" class="flight-badge">${f}</a>`;
              }).join("")}
            </div>
          </div>
        </div>
      </div>
    `).join("");

    groupEl.appendChild(header);
    groupEl.appendChild(pairingsEl);
    groupsContainer.appendChild(groupEl);
  });
}

let allRosters = {};

Promise.all([
  fetch(ROSTERS_URL).then(res => res.json()),
  fetch(CREW_URL).then(res => res.json())
])
  .then(([rosters, crew]) => {
    allRosters = rosters;
    crewById = Object.fromEntries(crew.map(c => [c.crew_id, c]));
    document.querySelectorAll('.tz-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tz === globalTimeZone);
    });
    populateAircraftFilter(allRosters);
    populateDateFilter(allRosters);
    render(allRosters);
  })
  .catch(() => {
    document.getElementById("groupsContainer").innerHTML =
      `<div class="empty-msg">Could not load data files. Serve this file over HTTP (not file://) so the fetch works, e.g. run a local static server from the project root.</div>`;
  });

document.getElementById("searchBox").addEventListener("input", () => render(allRosters));
document.getElementById("aircraftFilter").addEventListener("change", () => render(allRosters));
document.getElementById("dateFilter").addEventListener("change", () => render(allRosters));
</script>

</div>
</body>
</html>
