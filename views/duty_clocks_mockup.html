<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Crew Saathi — Duty Clocks</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #161d2e;
    --tile: #1c2438;
    --border: #2a3350;
    --text: #e6e9f0;
    --muted: #8892a6;
    --duty: #5b8cff;
    --flight: #35c97f;
    --rest: #2a3350;
    --accent: #5b8cff;
    --warn: #f2b84b;
    --bad: #f2554b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
  }
  .sidebar {
    width: 220px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 24px 0;
    flex-shrink: 0;
    height: 100vh;
    overflow-y: auto;
    position: fixed;
    left: 0;
    top: 0;
  }
  .sidebar-logo {
    padding: 0 20px 24px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-logo a {
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.3px;
  }
  .sidebar-logo a span {
    color: var(--accent);
  }
  .sidebar-nav {
    display: flex;
    flex-direction: column;
  }
  .sidebar-nav a {
    color: var(--muted);
    text-decoration: none;
    padding: 10px 20px;
    font-size: 13px;
    transition: color 0.12s ease, background 0.12s ease;
    border-left: 3px solid transparent;
  }
  .sidebar-nav a:hover {
    color: var(--text);
    background: rgba(91, 140, 255, 0.1);
  }
  .sidebar-nav a.active {
    color: var(--accent);
    background: rgba(91, 140, 255, 0.15);
    border-left-color: var(--accent);
  }
  .timezone-selector {
    padding: 16px 20px;
    margin-top: auto;
    border-top: 1px solid var(--border);
  }
  .timezone-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    display: block;
    margin-bottom: 8px;
  }
  .timezone-buttons {
    display: flex;
    gap: 6px;
  }
  .tz-btn {
    flex: 1;
    padding: 6px 8px;
    font-size: 11px;
    font-weight: 600;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .tz-btn:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  .tz-btn.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }
  .main-content {
    margin-left: 220px;
    flex: 1;
    padding: 24px 32px 48px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 { font-size: 22px; margin: 0; letter-spacing: 0.3px; }
  h1 span { color: var(--accent); }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .toolbar input, .toolbar select {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
  }
  .legend {
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .legend .dot { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-right: 6px; }

  .summary-bar { display: flex; gap: 14px; margin-bottom: 24px; flex-wrap: wrap; }
  .summary-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 18px;
    min-width: 140px;
  }
  .summary-card .num { font-size: 20px; font-weight: 600; }
  .summary-card .lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .crew-summary-link {
    display: block;
    transition: opacity 0.12s ease;
  }
  .crew-summary-link:hover {
    opacity: 0.7;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
  }
  .panel h2 {
    font-size: 14px;
    margin: 0 0 14px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }

  .gantt-row {
    display: grid;
    grid-template-columns: 90px 1fr 130px;
    align-items: center;
    gap: 10px;
    padding: 4px 0;
  }
  .gantt-row .date-lbl {
    font-size: 11px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .gantt-row.weekend .date-lbl { color: var(--accent); }
  .track {
    position: relative;
    background: var(--rest);
    border-radius: 4px;
    height: 18px;
    overflow: hidden;
  }
  .bar {
    position: absolute;
    top: 0; bottom: 0; left: 0;
    border-radius: 4px;
    display: flex;
    align-items: center;
  }
  .bar.duty { background: var(--duty); opacity: 0.35; }
  .bar.flight { background: var(--flight); }
  .gantt-row .hours-lbl {
    font-size: 11px;
    color: var(--muted);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .axis-row {
    display: grid;
    grid-template-columns: 90px 1fr 130px;
    gap: 10px;
    margin-bottom: 8px;
  }
  .axis-row .axis-track {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--muted);
  }

  .empty-msg { color: var(--muted); font-size: 13px; padding: 20px; text-align: center; }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <a href="crew_mockup.html">Crew<span>Saathi</span></a>
  </div>
  <nav class="sidebar-nav">
    <a href="crew_mockup.html">Crew Roster</a>
    <a href="certifications_mockup.html">Certifications</a>
    <a href="duty_clocks_mockup.html" class="active">Duty Clocks</a>
    <a href="flights_mockup.html">Flights</a>
    <a href="rosters_mockup.html">Rosters</a>
    <a href="rules_mockup.html">Rules</a>
  </nav>
  <div class="timezone-selector">
    <span class="timezone-label">Time Zone</span>
    <div class="timezone-buttons">
      <button class="tz-btn active" data-tz="UTC" onclick="setTimeZone('UTC')">UTC</button>
      <button class="tz-btn" data-tz="LOCAL" onclick="setTimeZone('LOCAL')">Local</button>
    </div>
  </div>
</aside>

<div class="main-content">
<header>
  <h1>Crew<span>Saathi</span> — Duty Clocks</h1>
  <div class="toolbar">
    <select id="crewFilter">
      <option value="all">Select crew…</option>
    </select>
  </div>
</header>

<div class="legend">
  <span><span class="dot" style="background:var(--duty)"></span>Duty hours</span>
  <span><span class="dot" style="background:var(--flight)"></span>Flight hours</span>
  <span><span class="dot" style="background:var(--rest)"></span>Rest / off</span>
  <span>Reference date: 2026-09-20</span>
</div>

<div class="summary-bar" id="summaryBar"></div>

<div class="panel" id="ganttPanel">
  <h2>Daily history (last 28 days)</h2>
  <div id="ganttContainer"></div>
</div>

<script>
const DUTY_URL = "data/duty_clocks.json";
const CREW_URL = "data/crew.json";
const MAX_DAILY_HOURS = 12; // scale for bar widths

let crewById = {};
let globalTimeZone = localStorage.getItem('timeZone') || 'UTC';

function setTimeZone(tz) {
  globalTimeZone = tz;
  localStorage.setItem('timeZone', tz);

  document.querySelectorAll('.tz-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tz === tz);
  });

  render();
}

// Try hash first (server won't strip it), then fall back to query string
function getCrewIdFromLocation() {
  // Try new hash format: #crew_id=...
  if (window.location.hash) {
    const hashParams = new URLSearchParams(window.location.hash.substring(1));
    const fromHash = hashParams.get("crew_id");
    if (fromHash) return decodeURIComponent(fromHash);
  }
  // Fall back to query string for backward compatibility
  const params = new URLSearchParams(window.location.search);
  const fromQuery = params.get("crew_id");
  if (fromQuery) return fromQuery;
  // Fall back to old hash format: #crew-...
  const hashMatch = window.location.hash.match(/crew-(.+)$/);
  return hashMatch ? decodeURIComponent(hashMatch[1]) : null;
}

function isWeekend(dateStr) {
  const day = new Date(dateStr + "T00:00:00").getDay();
  return day === 0 || day === 6;
}

function formatDateShort(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString(undefined, { month: "short", day: "2-digit" });
}

function getLocalHours(isoString) {
  const d = new Date(isoString);
  return d.getHours() + d.getMinutes() / 60;
}

function formatTimeForDisplay(isoString) {
  const d = new Date(isoString);
  return d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: false });
}

function renderSummary(record, crew) {
  const summaryBar = document.getElementById("summaryBar");
  if (!record) {
    summaryBar.innerHTML = "";
    return;
  }
  const crewLabel = crew ? `${crew.name} · ${crew.rank} · ${crew.base}` : "Crew record not found";

  let lastRestDisplay;
  if (globalTimeZone === 'UTC') {
    const d = new Date(record.last_rest_ended);
    const utcStr = d.toLocaleString('en-US', { timeZone: 'UTC', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    lastRestDisplay = `${utcStr} UTC`;
  } else {
    lastRestDisplay = new Date(record.last_rest_ended).toLocaleString();
  }

  summaryBar.innerHTML = `
    <div class="summary-card"><a class="crew-summary-link" href="crew_mockup.html#crew_id=${encodeURIComponent(record.crew_id)}" style="color:inherit;text-decoration:none;"><div class="num">${record.crew_id}</div><div class="lbl">${crewLabel}</div></a></div>
    <div class="summary-card"><div class="num">${record.duty_hours_7d.toFixed(1)}h</div><div class="lbl">Duty hours (7d)</div></div>
    <div class="summary-card"><div class="num">${record.flight_hours_28d.toFixed(1)}h</div><div class="lbl">Flight hours (28d)</div></div>
    <div class="summary-card"><div class="num">${lastRestDisplay}</div><div class="lbl">Last rest ended</div></div>
  `;
}

function renderGantt(record) {
  const container = document.getElementById("ganttContainer");
  if (!record) {
    container.innerHTML = `<div class="empty-msg">Select a crew id to view their duty history.</div>`;
    return;
  }

  const rows = record.daily_history.map(day => {
    const dutyPct = Math.min(100, (day.duty_hours / MAX_DAILY_HOURS) * 100);
    const flightPct = Math.min(100, (day.flight_hours / MAX_DAILY_HOURS) * 100);
    return `
      <div class="gantt-row ${isWeekend(day.date) ? "weekend" : ""}">
        <div class="date-lbl">${formatDateShort(day.date)}</div>
        <div class="track">
          <div class="bar duty" style="width:${dutyPct}%"></div>
          <div class="bar flight" style="width:${flightPct}%"></div>
        </div>
        <div class="hours-lbl">${day.duty_hours.toFixed(1)}h duty · ${day.flight_hours.toFixed(1)}h flight</div>
      </div>
    `;
  }).join("");

  container.innerHTML = `
    <div class="axis-row">
      <div></div>
      <div class="axis-track"><span>0h</span><span>${MAX_DAILY_HOURS / 2}h</span><span>${MAX_DAILY_HOURS}h</span></div>
      <div></div>
    </div>
    ${rows}
  `;
}

function render() {
  const crewFilter = document.getElementById("crewFilter").value;
  const record = crewFilter !== "all" ? allRecords.find(r => r.crew_id === crewFilter) : null;
  renderSummary(record, crewById[crewFilter]);
  renderGantt(record);
}

function populateCrewFilter(records) {
  const crewFilter = document.getElementById("crewFilter");
  const sorted = [...records].sort((a, b) => a.crew_id.localeCompare(b.crew_id));
  sorted.forEach(r => {
    const opt = document.createElement("option");
    opt.value = r.crew_id;
    const crew = crewById[r.crew_id];
    opt.textContent = crew ? `${r.crew_id} — ${crew.name}` : r.crew_id;
    crewFilter.appendChild(opt);
  });

  const crewIdParam = getCrewIdFromLocation();
  if (crewIdParam && records.some(r => r.crew_id === crewIdParam)) {
    crewFilter.value = crewIdParam;
  }
}

let allRecords = [];

Promise.all([
  fetch(DUTY_URL).then(res => res.json()),
  fetch(CREW_URL).then(res => res.json())
])
  .then(([duty, crew]) => {
    crewById = Object.fromEntries(crew.map(c => [c.crew_id, c]));
    allRecords = duty;
    document.querySelectorAll('.tz-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tz === globalTimeZone);
    });
    populateCrewFilter(allRecords);
    render();
  })
  .catch(() => {
    document.getElementById("ganttContainer").innerHTML =
      `<div class="empty-msg">Could not load ${DUTY_URL} or ${CREW_URL}. Serve this file over HTTP (not file://) so the fetch works, e.g. run a local static server from the project root.</div>`;
  });

document.getElementById("crewFilter").addEventListener("change", render);
</script>

</div>
</body>
</html>
