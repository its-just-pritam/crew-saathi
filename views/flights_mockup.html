<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Crew Admin</title>
<style>
  :root {
    --bg: #0f1420;
    --panel: #161d2e;
    --tile: #1c2438;
    --border: #2a3350;
    --text: #e6e9f0;
    --muted: #8892a6;
    --accent: #5b8cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
  }
  .sidebar {
    width: 220px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 24px 0;
    flex-shrink: 0;
    height: 100vh;
    overflow-y: auto;
    position: fixed;
    left: 0;
    top: 0;
  }
  .sidebar-logo {
    padding: 0 20px 24px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-logo a {
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.3px;
  }
  .sidebar-logo a span {
    color: var(--accent);
  }
  .sidebar-nav {
    display: flex;
    flex-direction: column;
  }
  .sidebar-nav a {
    color: var(--muted);
    text-decoration: none;
    padding: 10px 20px;
    font-size: 13px;
    transition: color 0.12s ease, background 0.12s ease;
    border-left: 3px solid transparent;
  }
  .sidebar-nav a:hover {
    color: var(--text);
    background: rgba(91, 140, 255, 0.1);
  }
  .sidebar-nav a.active {
    color: var(--accent);
    background: rgba(91, 140, 255, 0.15);
    border-left-color: var(--accent);
  }
  .timezone-selector {
    padding: 16px 20px;
    margin-top: auto;
    border-top: 1px solid var(--border);
  }
  .timezone-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    display: block;
    margin-bottom: 8px;
  }
  .timezone-buttons {
    display: flex;
    gap: 6px;
  }
  .tz-btn {
    flex: 1;
    padding: 6px 8px;
    font-size: 11px;
    font-weight: 600;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .tz-btn:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  .tz-btn.active {
    background: var(--accent);
    color: var(--bg);
    border-color: var(--accent);
  }
  .main-content {
    margin-left: 220px;
    flex: 1;
    padding: 24px 32px 48px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 {
    font-size: 22px;
    margin: 0;
    letter-spacing: 0.3px;
  }
  h1 span { color: var(--accent); }
  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .toolbar input, .toolbar select {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
  }
  .legend {
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .summary-bar {
    display: flex;
    gap: 14px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .summary-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 18px;
    min-width: 120px;
  }
  .summary-card .num { font-size: 22px; font-weight: 600; }
  .summary-card .lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .group { margin-bottom: 34px; }
  .group-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    cursor: pointer;
    user-select: none;
  }
  .group-header h2 {
    font-size: 15px;
    margin: 0;
    letter-spacing: 0.4px;
  }
  .group-header .count {
    font-size: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 2px 10px;
    border-radius: 999px;
  }
  .group-header .caret {
    color: var(--muted);
    transition: transform 0.15s ease;
    font-size: 11px;
  }
  .group.collapsed .caret { transform: rotate(-90deg); }
  .group.collapsed .flights-list { display: none; }
  .group.collapsed .gantt-content { display: none; }

  .flights-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .flight-row {
    background: var(--tile);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr auto;
    gap: 16px;
    align-items: center;
    transition: border-color 0.12s ease;
  }
  .flight-row:hover {
    border-color: var(--accent);
  }
  .flight-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .flight-no {
    font-weight: 600;
    font-size: 14px;
  }
  .flight-meta {
    font-size: 11px;
    color: var(--muted);
  }
  .flight-time {
    font-size: 12px;
  }
  .flight-route {
    text-align: center;
  }
  .flight-aircraft {
    font-size: 12px;
  }
  .flight-seats {
    font-size: 12px;
    color: var(--muted);
    text-align: right;
  }

  .empty-msg {
    color: var(--muted);
    font-size: 13px;
    padding: 20px;
    text-align: center;
  }

  .tabs {
    display: flex;
    gap: 2px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .tab-button {
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 10px 16px;
    cursor: pointer;
    font-size: 13px;
    transition: color 0.12s ease;
    border-bottom: 2px solid transparent;
  }
  .tab-button:hover {
    color: var(--text);
  }
  .tab-button.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .tab-content {
    display: none;
  }
  .tab-content.active {
    display: block;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 20px;
  }
  .panel h2 {
    font-size: 14px;
    margin: 0 0 14px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }

  .gantt-row {
    display: grid;
    grid-template-columns: 100px 1fr;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .gantt-row:last-child {
    border-bottom: none;
  }
  .gantt-flight-no {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
  }
  .gantt-track {
    position: relative;
    background: var(--rest);
    border-radius: 4px;
    height: 20px;
    overflow: hidden;
  }
  .gantt-bar {
    position: absolute;
    top: 0;
    bottom: 0;
    background: var(--accent);
    border-radius: 4px;
    opacity: 0.8;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px;
    font-size: 9px;
    color: var(--text);
    font-weight: 600;
    overflow: hidden;
  }
  .gantt-bar-text {
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .gantt-time {
    font-size: 11px;
    color: var(--muted);
    text-align: right;
  }

  .axis-row {
    display: grid;
    grid-template-columns: 100px 1fr 80px;
    gap: 10px;
    margin-bottom: 12px;
  }
  .axis-track {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--muted);
  }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo">
    <a href="crew_mockup.html">Crew<span>Saathi</span></a>
  </div>
  <nav class="sidebar-nav">
    <a href="crew_mockup.html">Crew Roster</a>
    <a href="certifications_mockup.html">Certifications</a>
    <a href="duty_clocks_mockup.html">Duty Clocks</a>
    <a href="flights_mockup.html" class="active">Flights</a>
    <a href="rosters_mockup.html">Rosters</a>
    <a href="rules_mockup.html">Rules</a>
  </nav>
  <div class="timezone-selector">
    <span class="timezone-label">Time Zone</span>
    <div class="timezone-buttons">
      <button class="tz-btn active" data-tz="UTC" onclick="setTimeZone('UTC')">UTC</button>
      <button class="tz-btn" data-tz="LOCAL" onclick="setTimeZone('LOCAL')">Local</button>
    </div>
  </div>
</aside>

<div class="main-content">
<header>
  <h1>Crew<span>Admin</span> — Flights</h1>
  <div class="toolbar">
    <input id="searchBox" type="text" placeholder="Search flight number or station…" />
    <select id="depStationFilter">
      <option value="all">All departure stations</option>
    </select>
    <select id="arrStationFilter">
      <option value="all">All arrival stations</option>
    </select>
    <select id="aircraftFilter">
      <option value="all">All aircraft</option>
    </select>
  </div>
</header>

<div class="summary-bar" id="summaryBar"></div>

<div class="tabs">
  <button class="tab-button active" data-tab="list">List View</button>
  <button class="tab-button" data-tab="gantt">Gantt Chart</button>
</div>

<div id="list" class="tab-content active">
  <div id="groupsContainer"></div>
</div>

<div id="gantt" class="tab-content">
  <div class="panel">
    <h2>Daily Timeline</h2>
    <div id="ganttContainer"></div>
  </div>
</div>

<script>
const FLIGHTS_URL = "data/flights.json";
let globalTimeZone = localStorage.getItem('timeZone') || 'UTC';

function setTimeZone(tz) {
  globalTimeZone = tz;
  localStorage.setItem('timeZone', tz);

  document.querySelectorAll('.tz-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tz === tz);
  });

  render(allRecords);
}

function getQueryParams() {
  // Try hash first (more reliable with server rewrites), then fall back to query string
  let params;
  if (window.location.hash) {
    params = new URLSearchParams(window.location.hash.substring(1));
  } else {
    params = new URLSearchParams(window.location.search);
  }
  const result = {
    flight: params.get('flight'),
    date: params.get('date')
  };
  if (result.flight || result.date) {
    console.log('Flight params found:', result, 'from', window.location.hash ? 'hash' : 'query');
  }
  return result;
}

function formatTime(isoString) {
  const d = new Date(isoString);
  if (globalTimeZone === 'UTC') {
    const utcStr = d.toLocaleString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'UTC' });
    return utcStr;
  } else {
    return d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', hour12: false });
  }
}

function getHoursForDisplay(isoString) {
  const d = new Date(isoString);
  if (globalTimeZone === 'UTC') {
    const utcHours = d.getUTCHours();
    const utcMinutes = d.getUTCMinutes();
    return utcHours + utcMinutes / 60;
  } else {
    return d.getHours() + d.getMinutes() / 60;
  }
}

function getLocalHours(isoString) {
  const d = new Date(isoString);
  return d.getHours() + d.getMinutes() / 60;
}

function formatDate(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: '2-digit' });
}

function populateStationFilters(records) {
  const depStationFilter = document.getElementById("depStationFilter");
  const arrStationFilter = document.getElementById("arrStationFilter");

  const depStations = new Set();
  const arrStations = new Set();

  records.forEach(r => {
    depStations.add(r.dep_station);
    arrStations.add(r.arr_station);
  });

  const depSorted = [...depStations].sort();
  depSorted.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s;
    opt.textContent = s;
    depStationFilter.appendChild(opt);
  });

  const arrSorted = [...arrStations].sort();
  arrSorted.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s;
    opt.textContent = s;
    arrStationFilter.appendChild(opt);
  });
}

function populateAircraftFilter(records) {
  const aircraftFilter = document.getElementById("aircraftFilter");
  const aircraft = [...new Set(records.map(r => r.aircraft))].sort();
  aircraft.forEach(a => {
    const opt = document.createElement("option");
    opt.value = a;
    opt.textContent = a;
    aircraftFilter.appendChild(opt);
  });
}

function getFilteredRecords(records) {
  const searchTerm = document.getElementById("searchBox").value.trim().toLowerCase();
  const depStationFilter = document.getElementById("depStationFilter").value;
  const arrStationFilter = document.getElementById("arrStationFilter").value;
  const aircraftFilter = document.getElementById("aircraftFilter").value;

  return records.filter(r => {
    if (depStationFilter !== "all" && r.dep_station !== depStationFilter) return false;
    if (arrStationFilter !== "all" && r.arr_station !== arrStationFilter) return false;
    if (aircraftFilter !== "all" && r.aircraft !== aircraftFilter) return false;
    if (searchTerm) {
      const match = r.flight_no.toLowerCase().includes(searchTerm) ||
                    r.dep_station.toLowerCase().includes(searchTerm) ||
                    r.arr_station.toLowerCase().includes(searchTerm);
      if (!match) return false;
    }
    return true;
  });
}

function renderSummary(records) {
  const summaryBar = document.getElementById("summaryBar");
  const filtered = getFilteredRecords(records);

  summaryBar.innerHTML = `
    <div class="summary-card"><div class="num">${filtered.length}</div><div class="lbl">Scheduled flights</div></div>
    <div class="summary-card"><div class="num">${new Set(filtered.map(r => r.aircraft)).size}</div><div class="lbl">Aircraft</div></div>
    <div class="summary-card"><div class="num">${new Set(filtered.map(r => r.dep_station)).size}</div><div class="lbl">Stations</div></div>
    <div class="summary-card"><div class="num">${filtered.reduce((sum, r) => sum + r.block_hours, 0).toFixed(1)}h</div><div class="lbl">Total block hours</div></div>
  `;
}

function renderListView(records) {
  const groupsContainer = document.getElementById("groupsContainer");
  const filtered = getFilteredRecords(records);
  groupsContainer.innerHTML = "";

  const groups = {};
  filtered.forEach(r => {
    if (!groups[r.date]) groups[r.date] = [];
    groups[r.date].push(r);
  });

  const groupNames = Object.keys(groups).sort();

  if (groupNames.length === 0) {
    groupsContainer.innerHTML = `<div class="empty-msg">No flights match the current filters.</div>`;
    return;
  }

  groupNames.forEach(date => {
    const items = groups[date].sort((a, b) => a.dep_utc.localeCompare(b.dep_utc));
    const groupEl = document.createElement("div");
    groupEl.className = "group";
    groupEl.setAttribute("data-date-group", date);

    const header = document.createElement("div");
    header.className = "group-header";
    header.innerHTML = `
      <span class="caret">▼</span>
      <h2>${formatDate(date)}</h2>
      <span class="count">${items.length}</span>
    `;
    header.addEventListener("click", () => groupEl.classList.toggle("collapsed"));

    const flightsEl = document.createElement("div");
    flightsEl.className = "flights-list";
    flightsEl.innerHTML = items.map(r => `
      <div class="flight-row" data-flight-id="${r.flight_no}-${r.date}">
        <div class="flight-info">
          <div class="flight-no">${r.flight_no}</div>
          <div class="flight-meta">${r.aircraft}</div>
        </div>
        <div class="flight-time">
          ${formatTime(r.dep_utc)}<span style="color:var(--muted)"> → </span>${formatTime(r.arr_utc)}
        </div>
        <div class="flight-route">
          <span style="font-weight:600">${r.dep_station}</span><span style="color:var(--muted)"> → </span><span style="font-weight:600">${r.arr_station}</span>
        </div>
        <div class="flight-aircraft">
          <span style="color:var(--muted)">Block:</span> ${r.block_hours}h · <span style="color:var(--muted)">Type:</span> ${r.aircraft_type}
        </div>
        <div class="flight-seats">${r.seats} seats</div>
      </div>
    `).join("");

    groupEl.appendChild(header);
    groupEl.appendChild(flightsEl);
    groupsContainer.appendChild(groupEl);
  });
}

function renderGanttView(records) {
  const ganttContainer = document.getElementById("ganttContainer");
  const filtered = getFilteredRecords(records);
  ganttContainer.innerHTML = "";

  if (filtered.length === 0) {
    ganttContainer.innerHTML = `<div class="empty-msg">No flights match the current filters.</div>`;
    return;
  }

  const groups = {};
  filtered.forEach(r => {
    if (!groups[r.date]) groups[r.date] = [];
    groups[r.date].push(r);
  });

  const groupNames = Object.keys(groups).sort();
  const MAX_HOURS = 24;

  groupNames.forEach(date => {
    const items = groups[date].sort((a, b) => a.dep_utc.localeCompare(b.dep_utc));

    const groupEl = document.createElement("div");
    groupEl.className = "group";
    groupEl.setAttribute("data-date-group", date);

    const header = document.createElement("div");
    header.className = "group-header";
    header.innerHTML = `
      <span class="caret">▼</span>
      <h2>${formatDate(date)}</h2>
      <span class="count">${items.length}</span>
    `;
    header.addEventListener("click", () => groupEl.classList.toggle("collapsed"));

    const ganttContent = document.createElement("div");
    ganttContent.className = "gantt-content";

    const axisRow = document.createElement("div");
    axisRow.className = "axis-row";
    const timeLabels = Array.from({length: 13}, (_, i) => {
      const hours = i * 2;
      return `<span>${hours.toString().padStart(2, '0')}:00</span>`;
    }).join('');
    axisRow.innerHTML = `
      <div></div>
      <div class="axis-track">${timeLabels}</div>
      <div></div>
    `;

    const rowsHtml = items.map(r => {
      const depHours = getHoursForDisplay(r.dep_utc);
      const arrHours = getHoursForDisplay(r.arr_utc);

      const depPct = Math.max(0, Math.min(100, (depHours / 24) * 100));
      let durationHours = arrHours - depHours;
      if (durationHours < 0) durationHours += 24;
      const widthPct = Math.max(1, Math.min(100 - depPct, (durationHours / 24) * 100));

      return `
        <div class="gantt-row">
          <div class="gantt-flight-no">${r.flight_no}</div>
          <div class="gantt-track">
            <div class="gantt-bar" style="left:${depPct}%;width:${widthPct}%;" title="${r.flight_no} ${r.dep_station}→${r.arr_station} ${formatTime(r.dep_utc)} • Block: ${r.block_hours}h">
              <span class="gantt-bar-text">${r.dep_station}</span>
              <span class="gantt-bar-text">${r.arr_station}</span>
            </div>
          </div>
        </div>
      `;
    }).join("");

    ganttContent.appendChild(axisRow);
    ganttContent.innerHTML += rowsHtml;

    groupEl.appendChild(header);
    groupEl.appendChild(ganttContent);
    ganttContainer.appendChild(groupEl);
  });
}

function render(records) {
  renderSummary(records);
  const activeTab = document.querySelector(".tab-button.active").dataset.tab;
  if (activeTab === "list") {
    renderListView(records);

    const params = getQueryParams();
    if (params.flight && params.date) {
      setTimeout(() => {
        const dateGroup = document.querySelector(`[data-date-group="${params.date}"]`);
        if (dateGroup) {
          dateGroup.classList.remove("collapsed");
        }
        const flightEl = document.querySelector(`[data-flight-id="${params.flight}-${params.date}"]`);
        if (flightEl) {
          flightEl.scrollIntoView({ behavior: "smooth", block: "center" });
          flightEl.style.background = "rgba(91, 140, 255, 0.2)";
          flightEl.style.transition = "background 0.3s ease";
          setTimeout(() => {
            flightEl.style.background = "";
          }, 2500);
        } else {
          console.log(`Flight ${params.flight} on ${params.date} not found in DOM`);
        }
      }, 50);
    }
  } else {
    renderGanttView(records);
  }
}

let allRecords = [];

function switchTab(tabName) {
  document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
  document.querySelectorAll(".tab-button").forEach(el => el.classList.remove("active"));

  document.getElementById(tabName).classList.add("active");
  document.querySelector(`[data-tab="${tabName}"]`).classList.add("active");

  render(allRecords);
}

fetch(FLIGHTS_URL)
  .then(res => res.json())
  .then(data => {
    allRecords = data;
    document.querySelectorAll('.tz-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tz === globalTimeZone);
    });
    populateStationFilters(allRecords);
    populateAircraftFilter(allRecords);

    const params = getQueryParams();
    if (params.flight) {
      console.log(`Setting search to: ${params.flight}`);
      document.getElementById("searchBox").value = params.flight;
    }
    console.log(`Data loaded. Total flights: ${allRecords.length}`);
    render(allRecords);
  })
  .catch(() => {
    document.getElementById("groupsContainer").innerHTML =
      `<div class="empty-msg">Could not load ${FLIGHTS_URL}. Serve this file over HTTP (not file://) so the fetch works, e.g. run a local static server from the project root.</div>`;
  });

document.querySelectorAll(".tab-button").forEach(button => {
  button.addEventListener("click", () => switchTab(button.dataset.tab));
});

document.getElementById("searchBox").addEventListener("input", () => render(allRecords));
document.getElementById("depStationFilter").addEventListener("change", () => render(allRecords));
document.getElementById("arrStationFilter").addEventListener("change", () => render(allRecords));
document.getElementById("aircraftFilter").addEventListener("change", () => render(allRecords));
</script>

</div>
</body>
</html>
